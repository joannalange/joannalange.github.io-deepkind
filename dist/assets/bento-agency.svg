<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" aria-hidden="true">
  <!-- Arrow / upward trajectory — agency, momentum -->
  <!-- Main upward arrow shaft -->
  <line x1="60" y1="105" x2="60" y2="30" stroke="currentColor" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <!-- Arrow head -->
  <polyline points="42,50 60,28 78,50" stroke="currentColor" stroke-width="2" opacity="0.6" fill="none"
    stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Trailing motion lines -->
  <line x1="35" y1="75" x2="58" y2="75" stroke="currentColor" stroke-width="1" opacity="0.25" stroke-linecap="round"/>
  <line x1="42" y1="87" x2="58" y2="87" stroke="currentColor" stroke-width="1" opacity="0.18" stroke-linecap="round"/>
  <line x1="50" y1="99" x2="58" y2="99" stroke="currentColor" stroke-width="1" opacity="0.12" stroke-linecap="round"/>
  <!-- Orbit / circle around arrow tip (agency = agency in space) -->
  <ellipse cx="60" cy="38" rx="22" ry="10"
    stroke="currentColor" stroke-width="0.75" opacity="0.2"
    stroke-dasharray="4 4"
    transform="rotate(-20 60 38)"/>
  <!-- Star / spark at tip -->
  <circle cx="60" cy="28" r="3.5" fill="currentColor" opacity="0.7"/>
  <circle cx="60" cy="28" r="8"   stroke="currentColor" stroke-width="0.75" opacity="0.25" fill="none"/>
</svg>
