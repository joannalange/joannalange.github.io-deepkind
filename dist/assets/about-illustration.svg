<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" fill="none" aria-hidden="true">
  <!-- Organic blob (humanity) -->
  <ellipse cx="220" cy="250" rx="160" ry="190"
    fill="url(#about-blob)" opacity="0.15"
    transform="rotate(-10 220 250)"/>

  <!-- Hexagon grid (technology) — right half -->
  <g stroke="url(#hex-grad)" stroke-width="1" opacity="0.5" fill="none">
    <!-- Row 0 -->
    <polygon points="310,80 336,94 336,122 310,136 284,122 284,94"/>
    <polygon points="362,80 388,94 388,122 362,136 336,122 336,94"/>
    <polygon points="414,80 440,94 440,122 414,136 388,122 388,94"/>
    <!-- Row 1 (offset) -->
    <polygon points="336,136 362,150 362,178 336,192 310,178 310,150"/>
    <polygon points="388,136 414,150 414,178 388,192 362,178 362,150"/>
    <polygon points="440,136 466,150 466,178 440,192 414,178 414,150"/>
    <!-- Row 2 -->
    <polygon points="310,192 336,206 336,234 310,248 284,234 284,206"/>
    <polygon points="362,192 388,206 388,234 362,248 336,234 336,206"/>
    <polygon points="414,192 440,206 440,234 414,248 388,234 388,206"/>
    <!-- Row 3 (offset) -->
    <polygon points="336,248 362,262 362,290 336,304 310,290 310,262"/>
    <polygon points="388,248 414,262 414,290 388,304 362,290 362,262"/>
  </g>

  <!-- Highlighted hex (intersection point) -->
  <polygon points="336,192 362,206 362,234 336,248 310,234 310,206"
    fill="url(#about-blob)" opacity="0.4" stroke="url(#hex-grad)" stroke-width="1.5"/>

  <!-- Organic curve overlapping grid -->
  <path d="M 160 320 Q 240 240 340 260 Q 420 280 400 360 Q 380 420 300 400 Q 200 380 160 320 Z"
    fill="url(#overlap-grad)" opacity="0.12"/>

  <!-- Connecting dots: grid corners to organic zone -->
  <circle cx="336" cy="220" r="4"  fill="#3730A3" opacity="0.8"/>
  <circle cx="280" cy="280" r="3"  fill="#00E5FF" opacity="0.7"/>
  <circle cx="390" cy="260" r="3"  fill="#7C3AED" opacity="0.6"/>
  <circle cx="240" cy="340" r="3.5" fill="#FB7185" opacity="0.7"/>

  <!-- Lines between dots -->
  <line x1="336" y1="220" x2="280" y2="280" stroke="#3730A3" stroke-width="1" opacity="0.3" stroke-dasharray="4 4"/>
  <line x1="280" y1="280" x2="240" y2="340" stroke="#00E5FF" stroke-width="1" opacity="0.25" stroke-dasharray="4 4"/>
  <line x1="336" y1="220" x2="390" y2="260" stroke="#7C3AED" stroke-width="1" opacity="0.25" stroke-dasharray="4 4"/>

  <!-- Small decorative elements -->
  <circle cx="160" cy="160" r="2" fill="#FBBF24" opacity="0.5"/>
  <circle cx="440" cy="360" r="2" fill="#FB7185" opacity="0.5"/>
  <circle cx="100" cy="380" r="1.5" fill="#00E5FF" opacity="0.4"/>

  <!-- Pulse rings at intersection -->
  <circle cx="336" cy="220" r="16" stroke="#3730A3" stroke-width="1" opacity="0.2" fill="none"/>
  <circle cx="336" cy="220" r="28" stroke="#3730A3" stroke-width="0.75" opacity="0.1" fill="none"/>

  <defs>
    <radialGradient id="about-blob" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#3730A3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hex-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="overlap-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
