<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" aria-hidden="true">

  <!-- 1. Large rose disc — top-right anchor -->
  <circle cx="490" cy="125" r="195" fill="#FB7185" opacity="0.88"/>

  <!-- 2. Bold indigo ring — centre composition -->
  <circle cx="295" cy="340" r="155" stroke="#3730A3" stroke-width="50" fill="none" opacity="0.85"/>

  <!-- 3. Solid cyan circle — lower-left, well inside bounds -->
  <circle cx="105" cy="460" r="100" fill="#00E5FF" opacity="0.82"/>

  <!-- 4. Solid amber circle — accent, lower-right -->
  <circle cx="490" cy="430" r="58"  fill="#FBBF24" opacity="0.90"/>

  <!-- 5. Purple arc — right edge, bottom quarter -->
  <path d="M 600 390 A 155 155 0 0 0 445 545"
    stroke="#7C3AED" stroke-width="50" fill="none" opacity="0.82" stroke-linecap="round"/>

</svg>
