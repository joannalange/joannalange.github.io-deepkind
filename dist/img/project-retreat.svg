<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- Sky gradient — golden hour -->
  <rect width="600" height="400" fill="url(#retreat-sky)"/>

  <!-- Distant mountains -->
  <path d="M0 280 L80 180 L160 240 L220 160 L300 220 L360 150 L440 210 L500 170 L600 230 L600 400 L0 400 Z"
    fill="url(#mountain-grad)" opacity="0.6"/>

  <!-- Mid-ground hills -->
  <path d="M0 320 Q100 270 200 300 Q300 270 400 300 Q500 270 600 310 L600 400 L0 400 Z"
    fill="url(#hill-grad)"/>

  <!-- Foreground ground -->
  <path d="M0 350 Q150 330 300 340 Q450 330 600 345 L600 400 L0 400 Z"
    fill="#166534" opacity="0.7"/>

  <!-- Trees — left cluster -->
  <g opacity="0.9">
    <!-- Tree 1 -->
    <rect x="40" y="230" width="8" height="90" fill="#92400E"/>
    <polygon points="44,160 15,240 73,240" fill="#14532D"/>
    <polygon points="44,190 20,255 68,255" fill="#166534"/>
    <!-- Tree 2 -->
    <rect x="90" y="245" width="7" height="80" fill="#92400E"/>
    <polygon points="93,178 67,250 120,250" fill="#15803D"/>
    <polygon points="93,205 70,262 116,262" fill="#166534"/>
    <!-- Tree 3 -->
    <rect x="130" y="255" width="6" height="70" fill="#78350F"/>
    <polygon points="133,200 110,260 156,260" fill="#14532D"/>
  </g>

  <!-- Trees — right cluster -->
  <g opacity="0.9">
    <rect x="455" y="240" width="8" height="85" fill="#92400E"/>
    <polygon points="459,168 430,248 488,248" fill="#14532D"/>
    <polygon points="459,198 435,260 483,260" fill="#166534"/>
    <rect x="510" y="248" width="7" height="78" fill="#92400E"/>
    <polygon points="513,182 488,255 538,255" fill="#15803D"/>
    <rect x="548" y="256" width="6" height="68" fill="#78350F"/>
    <polygon points="551,204 528,262 574,262" fill="#14532D"/>
  </g>

  <!-- Campfire -->
  <g transform="translate(278, 310)">
    <!-- Logs -->
    <rect x="-20" y="28" width="44" height="8" rx="4" fill="#78350F" transform="rotate(-15 2 32)"/>
    <rect x="-18" y="26" width="40" height="7" rx="3.5" fill="#92400E" transform="rotate(12 2 30)"/>
    <!-- Fire flames -->
    <path d="M2 25 Q-12 10 -5 0 Q0 8 2 4 Q4 8 9 0 Q16 10 2 25 Z" fill="url(#fire-grad)" opacity="0.95"/>
    <path d="M2 25 Q-8 14 -3 6 Q1 12 2 8 Q3 12 7 6 Q12 14 2 25 Z" fill="#FCD34D" opacity="0.7"/>
    <!-- Glow -->
    <ellipse cx="2" cy="18" rx="22" ry="14" fill="#F97316" opacity="0.12"/>
    <ellipse cx="2" cy="22" rx="16" ry="10" fill="#FBBF24" opacity="0.15"/>
  </g>

  <!-- Firelight on ground -->
  <ellipse cx="300" cy="358" rx="80" ry="18" fill="#F97316" opacity="0.1"/>

  <!-- === Women sitting around fire === -->
  <!-- Woman 1 — left of fire -->
  <g transform="translate(185, 285)">
    <circle cx="30" cy="22" r="18" fill="#FDE68A"/>
    <!-- Hair (long dark) -->
    <path d="M12 18 Q14 0 30 -2 Q46 0 48 18 Q50 35 48 50 Q38 58 22 55 Q14 48 12 35 Z" fill="#1C1917" opacity="0.85"/>
    <!-- Shirt -->
    <ellipse cx="30" cy="65" rx="18" ry="22" fill="#A78BFA"/>
    <!-- Face -->
    <circle cx="24" cy="22" r="2.5" fill="#78350F" opacity="0.8"/>
    <circle cx="36" cy="22" r="2.5" fill="#78350F" opacity="0.8"/>
    <path d="M23 30 Q30 36 37 30" stroke="#78350F" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Arms around knees -->
    <path d="M12 58 Q0 72 8 85 Q20 90 28 82" stroke="#FDE68A" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M48 58 Q60 72 52 85" stroke="#FDE68A" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- Cup of tea -->
    <rect x="55" y="72" width="16" height="12" rx="3" fill="#F9A8D4"/>
    <path d="M71 76 Q76 72 74 80" stroke="#F9A8D4" stroke-width="2" fill="none"/>
    <path d="M63 72 Q60 66 66 65 Q70 65 68 70" stroke="#F9A8D4" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>

  <!-- Woman 2 — right of fire -->
  <g transform="translate(355, 278)">
    <circle cx="28" cy="22" r="17" fill="#FBBF24"/>
    <!-- Hair (curly) -->
    <path d="M11 14 Q14 2 28 0 Q42 2 45 14 Q50 22 45 32 Q38 20 28 18 Q18 20 11 32 Q6 22 11 14 Z" fill="#7C2D12"/>
    <!-- Shirt -->
    <ellipse cx="28" cy="63" rx="17" ry="21" fill="#FB7185"/>
    <!-- Face -->
    <circle cx="22" cy="20" r="2.5" fill="#7C2D12" opacity="0.8"/>
    <circle cx="34" cy="20" r="2.5" fill="#7C2D12" opacity="0.8"/>
    <path d="M21 28 Q28 34 35 28" stroke="#7C2D12" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Arms -->
    <path d="M11 56 Q-2 70 5 82" stroke="#FBBF24" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M45 56 Q56 68 50 80" stroke="#FBBF24" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Woman 3 — background (partially visible) -->
  <g transform="translate(262, 265)" opacity="0.75">
    <circle cx="28" cy="20" r="16" fill="#FDE68A"/>
    <ellipse cx="28" cy="60" rx="15" ry="18" fill="#60A5FA"/>
    <path d="M12 12 Q16 0 28 -2 Q40 0 44 12" fill="#374151"/>
    <circle cx="22" cy="18" r="2" fill="#374151" opacity="0.8"/>
    <circle cx="34" cy="18" r="2" fill="#374151" opacity="0.8"/>
    <path d="M21 26 Q28 31 35 26" stroke="#374151" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Stars in sky -->
  <circle cx="80"  cy="40"  r="1.5" fill="white" opacity="0.8"/>
  <circle cx="150" cy="25"  r="1"   fill="white" opacity="0.7"/>
  <circle cx="220" cy="50"  r="1.5" fill="white" opacity="0.6"/>
  <circle cx="380" cy="30"  r="1"   fill="white" opacity="0.8"/>
  <circle cx="450" cy="15"  r="1.5" fill="white" opacity="0.7"/>
  <circle cx="520" cy="45"  r="1"   fill="white" opacity="0.6"/>
  <circle cx="560" cy="25"  r="1.5" fill="white" opacity="0.8"/>
  <!-- Moon crescent -->
  <circle cx="520" cy="60" r="20" fill="#FEF3C7" opacity="0.9"/>
  <circle cx="527" cy="56" r="16" fill="url(#retreat-sky)"/>

  <defs>
    <linearGradient id="retreat-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1E1B4B"/>
      <stop offset="35%"  stop-color="#7C2D12"/>
      <stop offset="65%"  stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="mountain-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#374151"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="hill-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="fire-grad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%"   stop-color="#EF4444"/>
      <stop offset="50%"  stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
  </defs>
</svg>
