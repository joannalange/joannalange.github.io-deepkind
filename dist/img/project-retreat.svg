<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- Sky gradient — dusk / golden hour -->
  <rect width="600" height="400" fill="url(#retreat-sky)"/>

  <!-- Sun disc -->
  <circle cx="300" cy="155" r="55" fill="url(#sun-grad)" opacity="0.95"/>
  <circle cx="300" cy="155" r="40" fill="#FDE68A" opacity="0.9"/>
  <circle cx="300" cy="155" r="25" fill="#FEF9C3" opacity="0.95"/>
  <!-- Sun glow rays -->
  <g stroke="#FBBF24" stroke-width="2" opacity="0.4" stroke-linecap="round">
    <line x1="300" y1="85"  x2="300" y2="68"/>
    <line x1="300" y1="225" x2="300" y2="242"/>
    <line x1="230" y1="155" x2="213" y2="155"/>
    <line x1="370" y1="155" x2="387" y2="155"/>
    <line x1="251" y1="106" x2="239" y2="94"/>
    <line x1="349" y1="106" x2="361" y2="94"/>
    <line x1="251" y1="204" x2="239" y2="216"/>
    <line x1="349" y1="204" x2="361" y2="216"/>
  </g>

  <!-- Distant mountains -->
  <path d="M 0 270 L 80 190 L 140 230 L 200 170 L 270 220 L 320 175 L 380 215 L 440 165 L 510 210 L 560 180 L 600 220 L 600 400 L 0 400 Z"
    fill="url(#mountain-g)" opacity="0.75"/>
  <!-- Mountain snow caps -->
  <path d="M 200 170 L 215 185 L 200 170 Z" fill="white" opacity="0.5"/>
  <path d="M 440 165 L 455 180 L 427 180 Z" fill="white" opacity="0.45"/>

  <!-- Rolling hills (mid ground) -->
  <path d="M 0 310 Q 100 265 200 285 Q 300 260 400 280 Q 500 260 600 300 L 600 400 L 0 400 Z"
    fill="url(#hill-g)"/>

  <!-- Foreground ground -->
  <path d="M 0 350 Q 150 335 300 342 Q 450 335 600 348 L 600 400 L 0 400 Z"
    fill="#14532D"/>

  <!-- Trees — abstract triangles (forest silhouette) -->
  <!-- Left forest -->
  <polygon points="45,310 72,230 99,310"  fill="#166534"/>
  <polygon points="55,310 78,250 101,310" fill="#15803D"/>
  <rect x="68" y="310" width="8" height="35" rx="2" fill="#854D0E"/>
  <polygon points="88,310 108,245 128,310" fill="#14532D"/>
  <polygon points="96,310 114,255 132,310" fill="#166534"/>
  <rect x="107" y="310" width="7" height="30" rx="2" fill="#854D0E"/>
  <polygon points="130,315 147,260 164,315" fill="#166534"/>
  <rect x="142" y="315" width="6" height="25" rx="2" fill="#78350F"/>

  <!-- Right forest -->
  <polygon points="455,310 480,235 505,310" fill="#166534"/>
  <polygon points="465,310 488,252 511,310" fill="#15803D"/>
  <rect x="482" y="310" width="8" height="35" rx="2" fill="#854D0E"/>
  <polygon points="500,310 522,248 544,310" fill="#14532D"/>
  <polygon points="510,310 530,258 550,310" fill="#166534"/>
  <rect x="524" y="310" width="7" height="30" rx="2" fill="#854D0E"/>
  <polygon points="548,315 563,262 578,315" fill="#166534"/>
  <rect x="559" y="315" width="6" height="25" rx="2" fill="#78350F"/>

  <!-- Campfire glow on ground -->
  <ellipse cx="300" cy="362" rx="60" ry="14" fill="#F97316" opacity="0.15"/>
  <ellipse cx="300" cy="360" rx="35" ry="9"  fill="#FBBF24" opacity="0.20"/>

  <!-- Campfire -->
  <g transform="translate(280,330)">
    <rect x="-14" y="22" width="30" height="7" rx="3.5" fill="#78350F" transform="rotate(-12 1 25)"/>
    <rect x="-12" y="20" width="26" height="6" rx="3"   fill="#92400E" transform="rotate(10 1 23)"/>
    <!-- Flames -->
    <path d="M1 20 Q-10 8 -4 -2 Q0 6 1 2 Q2 6 6 -2 Q12 8 1 20 Z"
      fill="url(#fire-g)" opacity="0.95"/>
    <path d="M1 20 Q-6 11 -2 4 Q1 9 1 6 Q1 9 4 4 Q8 11 1 20 Z"
      fill="#FDE68A" opacity="0.7"/>
    <!-- Embers -->
    <circle cx="-8"  cy="-5" r="2" fill="#F97316" opacity="0.7"/>
    <circle cx="10" cy="-8" r="1.5" fill="#FBBF24" opacity="0.6"/>
    <circle cx="3"  cy="-12" r="1.5" fill="#F97316" opacity="0.5"/>
  </g>

  <!-- Stars -->
  <circle cx="80"  cy="50"  r="2" fill="white" opacity="0.8"/>
  <circle cx="160" cy="30"  r="1.5" fill="white" opacity="0.7"/>
  <circle cx="240" cy="55"  r="1.5" fill="white" opacity="0.6"/>
  <circle cx="420" cy="35"  r="2" fill="white" opacity="0.8"/>
  <circle cx="500" cy="18"  r="1.5" fill="white" opacity="0.7"/>
  <circle cx="560" cy="50"  r="2" fill="white" opacity="0.6"/>
  <circle cx="100" cy="100" r="1" fill="white" opacity="0.5"/>
  <circle cx="490" cy="95"  r="1" fill="white" opacity="0.5"/>
  <!-- Crescent moon -->
  <circle cx="520" cy="72" r="22" fill="#FEF3C7" opacity="0.9"/>
  <circle cx="528" cy="67" r="17" fill="url(#retreat-sky)"/>

  <!-- Birds (abstract V shapes) -->
  <path d="M 150 110 Q 156 105 162 110" stroke="white" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M 165 98 Q 170 93 175 98" stroke="white" stroke-width="1.5" fill="none" opacity="0.35" stroke-linecap="round"/>
  <path d="M 395 115 Q 400 110 405 115" stroke="white" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>

  <!-- Label -->
  <rect x="22" y="350" width="140" height="28" rx="14" fill="#166534" opacity="0.9"/>
  <text x="92" y="368" font-family="monospace" font-size="10" letter-spacing="0.08em"
    text-anchor="middle" fill="white" font-weight="600">DEEP &amp; KIND RETREAT</text>

  <defs>
    <linearGradient id="retreat-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1E1B4B"/>
      <stop offset="30%"  stop-color="#7C2D12"/>
      <stop offset="60%"  stop-color="#EA580C"/>
      <stop offset="85%"  stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <radialGradient id="sun-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FEF9C3"/>
      <stop offset="60%"  stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mountain-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#374151"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="hill-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="fire-g" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%"   stop-color="#EF4444"/>
      <stop offset="50%"  stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
  </defs>
</svg>
