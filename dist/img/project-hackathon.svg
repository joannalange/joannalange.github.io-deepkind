<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- Deep dark background with subtle purple -->
  <rect width="600" height="400" fill="url(#hack-bg)"/>

  <!-- Grid lines -->
  <g stroke="#6366F1" stroke-width="0.5" opacity="0.12">
    <line x1="0" y1="80"  x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="75"  y1="0" x2="75"  y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="225" y1="0" x2="225" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="375" y1="0" x2="375" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="525" y1="0" x2="525" y2="400"/>
  </g>

  <!-- Large terminal / code window -->
  <rect x="60" y="50" width="340" height="220" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <!-- Title bar -->
  <rect x="60" y="50" width="340" height="32" rx="10" fill="#1E293B"/>
  <rect x="60" y="72" width="340" height="10" fill="#1E293B"/>
  <!-- Traffic light dots -->
  <circle cx="82" cy="66" r="5" fill="#EF4444"/>
  <circle cx="98" cy="66" r="5" fill="#FBBF24"/>
  <circle cx="114" cy="66" r="5" fill="#22C55E"/>
  <!-- Window title -->
  <text x="220" y="70" font-family="monospace" font-size="10" text-anchor="middle" fill="#64748B">terminal — GrowUP_2026</text>

  <!-- Code lines -->
  <text x="80" y="104" font-family="monospace" font-size="11" fill="#22C55E">$ npm run hackathon</text>
  <text x="80" y="122" font-family="monospace" font-size="11" fill="#64748B">  Loading modules...</text>
  <text x="80" y="140" font-family="monospace" font-size="11" fill="#00E5FF">  ✓ <tspan fill="#A78BFA">empathy</tspan><tspan fill="#64748B">.js loaded</tspan></text>
  <text x="80" y="158" font-family="monospace" font-size="11" fill="#00E5FF">  ✓ <tspan fill="#A78BFA">kindness</tspan><tspan fill="#64748B">.ts compiled</tspan></text>
  <text x="80" y="176" font-family="monospace" font-size="11" fill="#00E5FF">  ✓ <tspan fill="#FB7185">creativity</tspan><tspan fill="#64748B">.py ready</tspan></text>
  <text x="80" y="194" font-family="monospace" font-size="11" fill="#64748B">  Building future...</text>
  <text x="80" y="212" font-family="monospace" font-size="11" fill="#22C55E">  🚀 Hackathon started!</text>
  <!-- Blinking cursor -->
  <rect x="80" y="224" width="8" height="14" rx="1" fill="#22C55E" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Data flow lines from terminal outward -->
  <path d="M 400 160 L 450 160 L 480 130" stroke="#00E5FF" stroke-width="1.5" opacity="0.5" fill="none" stroke-linecap="round"/>
  <path d="M 400 175 L 460 175 L 500 200" stroke="#A78BFA" stroke-width="1.5" opacity="0.45" fill="none" stroke-linecap="round"/>
  <path d="M 400 195 L 455 230 L 490 250" stroke="#22C55E" stroke-width="1.5" opacity="0.45" fill="none" stroke-linecap="round"/>

  <!-- Node cluster (right side) -->
  <circle cx="490" cy="125" r="10" fill="#00E5FF" opacity="0.9"/>
  <circle cx="530" cy="155" r="8"  fill="#A78BFA" opacity="0.9"/>
  <circle cx="510" cy="200" r="12" fill="#22C55E" opacity="0.85"/>
  <circle cx="555" cy="115" r="7"  fill="#FB7185" opacity="0.85"/>
  <circle cx="545" cy="235" r="9"  fill="#FBBF24" opacity="0.85"/>
  <circle cx="570" cy="175" r="6"  fill="#00E5FF" opacity="0.7"/>
  <!-- Node connections -->
  <line x1="490" y1="125" x2="530" y2="155" stroke="#00E5FF" stroke-width="1" opacity="0.35"/>
  <line x1="530" y1="155" x2="510" y2="200" stroke="#A78BFA" stroke-width="1" opacity="0.35"/>
  <line x1="510" y1="200" x2="545" y2="235" stroke="#22C55E" stroke-width="1" opacity="0.3"/>
  <line x1="555" y1="115" x2="490" y2="125" stroke="#FB7185" stroke-width="1" opacity="0.3"/>
  <line x1="555" y1="115" x2="530" y2="155" stroke="#FBBF24" stroke-width="1" opacity="0.3"/>
  <line x1="570" y1="175" x2="530" y2="155" stroke="#00E5FF" stroke-width="1" opacity="0.3"/>
  <line x1="570" y1="175" x2="545" y2="235" stroke="#A78BFA" stroke-width="1" opacity="0.3"/>
  <!-- Pulse rings on main nodes -->
  <circle cx="510" cy="200" r="20" stroke="#22C55E" stroke-width="1" opacity="0.2" fill="none"/>
  <circle cx="510" cy="200" r="30" stroke="#22C55E" stroke-width="0.75" opacity="0.1" fill="none"/>

  <!-- Sticky notes -->
  <rect x="60"  y="290" width="80" height="70" rx="4" fill="#FDE047" opacity="0.9" transform="rotate(-3 100 325)"/>
  <line x1="70" y1="310" x2="128" y2="310" stroke="#A16207" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  <line x1="70" y1="322" x2="122" y2="322" stroke="#A16207" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  <line x1="70" y1="334" x2="115" y2="334" stroke="#A16207" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  <line x1="70" y1="346" x2="120" y2="346" stroke="#A16207" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>

  <rect x="155" y="296" width="75" height="65" rx="4" fill="#A78BFA" opacity="0.85" transform="rotate(2 192 328)"/>
  <line x1="163" y1="314" x2="220" y2="314" stroke="#4C1D95" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  <line x1="163" y1="325" x2="215" y2="325" stroke="#4C1D95" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  <line x1="163" y1="336" x2="210" y2="336" stroke="#4C1D95" stroke-width="1.5" opacity="0.35" stroke-linecap="round"/>

  <rect x="243" y="292" width="72" height="70" rx="4" fill="#34D399" opacity="0.85" transform="rotate(-2 279 327)"/>
  <line x1="251" y1="310" x2="305" y2="310" stroke="#064E3B" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  <line x1="251" y1="322" x2="300" y2="322" stroke="#064E3B" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  <line x1="251" y1="334" x2="295" y2="334" stroke="#064E3B" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>

  <!-- Lightning bolt (energy/spark) -->
  <path d="M 395 60 L 378 105 L 392 105 L 372 150 L 415 95 L 400 95 Z"
    fill="#FBBF24" opacity="0.95"/>
  <path d="M 395 60 L 378 105 L 392 105 L 372 150 L 415 95 L 400 95 Z"
    fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.6"/>
  <!-- Lightning glow -->
  <ellipse cx="393" cy="105" rx="20" ry="45" fill="#FBBF24" opacity="0.12" transform="rotate(-5 393 105)"/>

  <!-- Floating data particles -->
  <circle cx="30"  cy="70"  r="3" fill="#00E5FF" opacity="0.5"/>
  <circle cx="30"  cy="180" r="2" fill="#FB7185" opacity="0.5"/>
  <circle cx="30"  cy="280" r="3" fill="#FBBF24" opacity="0.4"/>
  <circle cx="570" cy="60"  r="2" fill="#22C55E" opacity="0.5"/>
  <circle cx="570" cy="310" r="3" fill="#00E5FF" opacity="0.4"/>
  <circle cx="440" cy="320" r="2" fill="#A78BFA" opacity="0.5"/>
  <circle cx="460" cy="340" r="3" fill="#FB7185" opacity="0.4"/>

  <!-- Label -->
  <rect x="340" y="355" width="140" height="28" rx="14" fill="#6366F1" opacity="0.9"/>
  <text x="410" y="373" font-family="monospace" font-size="10" letter-spacing="0.08em"
    text-anchor="middle" fill="white" font-weight="600">GROWUP HACKATHON</text>

  <defs>
    <linearGradient id="hack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0C0E1A"/>
      <stop offset="60%"  stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0C0E1A"/>
    </linearGradient>
  </defs>
</svg>
