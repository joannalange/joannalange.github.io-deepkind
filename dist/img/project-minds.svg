<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- Warm amber background -->
  <rect width="600" height="400" fill="url(#minds-bg)"/>

  <!-- Energy/movement ribbons — two synchronized paths -->
  <!-- Ribbon A (amber/orange) — sweeping arc -->
  <path d="M 20 320 C 80 280 140 180 200 200 C 260 220 280 280 340 260
           C 400 240 420 160 480 180 C 540 200 570 240 600 220"
    stroke="url(#ribbon-a)" stroke-width="22" fill="none"
    stroke-linecap="round" opacity="0.85"/>
  <!-- Ribbon A shadow -->
  <path d="M 20 330 C 80 290 140 190 200 210 C 260 230 280 290 340 270
           C 400 250 420 170 480 190 C 540 210 570 250 600 230"
    stroke="#EA580C" stroke-width="10" fill="none"
    stroke-linecap="round" opacity="0.25"/>

  <!-- Ribbon B (rose/coral) — offset arc mirroring A -->
  <path d="M 20 80 C 80 120 140 220 200 200 C 260 180 280 120 340 140
           C 400 160 420 240 480 220 C 540 200 570 160 600 180"
    stroke="url(#ribbon-b)" stroke-width="18" fill="none"
    stroke-linecap="round" opacity="0.8"/>
  <!-- Ribbon B shadow -->
  <path d="M 20 70 C 80 110 140 210 200 190 C 260 170 280 110 340 130
           C 400 150 420 230 480 210 C 540 190 570 150 600 170"
    stroke="#9D174D" stroke-width="8" fill="none"
    stroke-linecap="round" opacity="0.2"/>

  <!-- Intersection glow where ribbons cross -->
  <circle cx="200" cy="200" r="30" fill="#FBBF24" opacity="0.5"/>
  <circle cx="200" cy="200" r="15" fill="#fff" opacity="0.8"/>
  <circle cx="480" cy="200" r="22" fill="#FB7185" opacity="0.45"/>
  <circle cx="480" cy="200" r="10" fill="#fff" opacity="0.8"/>

  <!-- Motion dots along ribbon A -->
  <circle cx="100" cy="296" r="7" fill="#F97316" opacity="0.9"/>
  <circle cx="270" cy="272" r="5" fill="#FB923C" opacity="0.8"/>
  <circle cx="550" cy="228" r="6" fill="#F97316" opacity="0.9"/>
  <!-- Motion dots along ribbon B -->
  <circle cx="100" cy="104" r="7" fill="#FB7185" opacity="0.9"/>
  <circle cx="270" cy="128" r="5" fill="#F43F5E" opacity="0.8"/>
  <circle cx="550" cy="172" r="6" fill="#FB7185" opacity="0.9"/>

  <!-- Radiating energy lines from intersections -->
  <g stroke="#FBBF24" stroke-width="1.5" opacity="0.4" stroke-linecap="round">
    <line x1="200" y1="170" x2="190" y2="150"/>
    <line x1="200" y1="170" x2="215" y2="152"/>
    <line x1="200" y1="230" x2="190" y2="250"/>
    <line x1="200" y1="230" x2="215" y2="248"/>
    <line x1="178" y1="200" x2="155" y2="195"/>
    <line x1="222" y1="200" x2="245" y2="195"/>
  </g>

  <!-- Pulse rings -->
  <circle cx="200" cy="200" r="45" stroke="#FBBF24" stroke-width="1.5" opacity="0.25" fill="none"/>
  <circle cx="200" cy="200" r="62" stroke="#FBBF24" stroke-width="1" opacity="0.12" fill="none"/>
  <circle cx="480" cy="200" r="38" stroke="#FB7185" stroke-width="1.5" opacity="0.2" fill="none"/>

  <!-- Decorative chevrons showing direction/movement -->
  <g fill="none" stroke="#EA580C" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <polyline points="370,310 390,300 370,290"/>
    <polyline points="395,310 415,300 395,290"/>
    <polyline points="420,310 440,300 420,290"/>
  </g>
  <g fill="none" stroke="#9D174D" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <polyline points="370,90 390,100 370,110"/>
    <polyline points="395,90 415,100 395,110"/>
  </g>

  <!-- Corner decorations -->
  <circle cx="40"  cy="40"  r="16" fill="#FBBF24" opacity="0.3"/>
  <circle cx="560" cy="360" r="20" fill="#FB7185" opacity="0.25"/>
  <rect x="530" y="20" width="30" height="30" rx="6"
    fill="none" stroke="#F97316" stroke-width="2" opacity="0.4"
    transform="rotate(15 545 35)"/>

  <!-- Label chips -->
  <rect x="22" y="350" width="130" height="28" rx="14" fill="#F97316" opacity="0.9"/>
  <text x="87" y="368" font-family="monospace" font-size="10" letter-spacing="0.08em"
    text-anchor="middle" fill="white" font-weight="600">MINDS &amp; MUSCLES</text>

  <defs>
    <linearGradient id="minds-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FEF9EE"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="ribbon-a" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FBBF24"/>
      <stop offset="50%"  stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="ribbon-b" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FDA4AF"/>
      <stop offset="50%"  stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
  </defs>
</svg>
