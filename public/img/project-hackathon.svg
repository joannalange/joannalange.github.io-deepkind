<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- Dark energetic background -->
  <rect width="600" height="400" fill="url(#hack-bg)"/>

  <!-- Grid lines (subtle) -->
  <g stroke="#A78BFA" stroke-width="0.5" opacity="0.1">
    <line x1="0"   y1="100" x2="600" y2="100"/>
    <line x1="0"   y1="200" x2="600" y2="200"/>
    <line x1="0"   y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0"   x2="100" y2="400"/>
    <line x1="200" y1="0"   x2="200" y2="400"/>
    <line x1="300" y1="0"   x2="300" y2="400"/>
    <line x1="400" y1="0"   x2="400" y2="400"/>
    <line x1="500" y1="0"   x2="500" y2="400"/>
  </g>

  <!-- Tables -->
  <rect x="30"  y="280" width="240" height="14" rx="4" fill="#3730A3" opacity="0.8"/>
  <rect x="330" y="280" width="240" height="14" rx="4" fill="#3730A3" opacity="0.8"/>
  <!-- Table legs -->
  <rect x="50"  y="294" width="8" height="50" rx="2" fill="#3730A3" opacity="0.6"/>
  <rect x="240" y="294" width="8" height="50" rx="2" fill="#3730A3" opacity="0.6"/>
  <rect x="350" y="294" width="8" height="50" rx="2" fill="#3730A3" opacity="0.6"/>
  <rect x="540" y="294" width="8" height="50" rx="2" fill="#3730A3" opacity="0.6"/>

  <!-- === Laptops on tables === -->
  <!-- Laptop 1 (left table) -->
  <g transform="translate(60, 240)">
    <rect x="0" y="30" width="70" height="44" rx="3" fill="#1E1B4B"/>
    <rect x="3" y="33" width="64" height="38" rx="2" fill="#0C0E1A"/>
    <!-- Screen glow (code green) -->
    <rect x="3" y="33" width="64" height="38" rx="2" fill="#22C55E" opacity="0.08"/>
    <!-- Code lines on screen -->
    <line x1="8"  y1="40" x2="40" y2="40" stroke="#22C55E" stroke-width="1.5" opacity="0.7"/>
    <line x1="8"  y1="45" x2="55" y2="45" stroke="#22C55E" stroke-width="1.5" opacity="0.5"/>
    <line x1="8"  y1="50" x2="35" y2="50" stroke="#00E5FF" stroke-width="1.5" opacity="0.6"/>
    <line x1="8"  y1="55" x2="48" y2="55" stroke="#22C55E" stroke-width="1.5" opacity="0.4"/>
    <line x1="8"  y1="60" x2="30" y2="60" stroke="#A78BFA" stroke-width="1.5" opacity="0.6"/>
    <line x1="8"  y1="65" x2="52" y2="65" stroke="#22C55E" stroke-width="1.5" opacity="0.5"/>
    <!-- Keyboard -->
    <rect x="-5" y="74" width="80" height="8" rx="2" fill="#1E1B4B"/>
  </g>

  <!-- Laptop 2 (left table) -->
  <g transform="translate(155, 245)">
    <rect x="0" y="28" width="68" height="42" rx="3" fill="#1E1B4B"/>
    <rect x="3" y="31" width="62" height="36" rx="2" fill="#0C0E1A"/>
    <rect x="3" y="31" width="62" height="36" rx="2" fill="#F97316" opacity="0.07"/>
    <!-- Browser/UI mockup -->
    <rect x="6" y="34" width="56" height="6" rx="1" fill="#F97316" opacity="0.4"/>
    <rect x="8" y="43" width="25" height="20" rx="1" fill="#374151" opacity="0.6"/>
    <rect x="35" y="43" width="25" height="9"  rx="1" fill="#374151" opacity="0.4"/>
    <rect x="35" y="54" width="25" height="9"  rx="1" fill="#374151" opacity="0.4"/>
    <rect x="-5" y="70" width="78" height="8" rx="2" fill="#1E1B4B"/>
  </g>

  <!-- Laptop 3 (right table) -->
  <g transform="translate(345, 242)">
    <rect x="0" y="30" width="70" height="44" rx="3" fill="#1E1B4B"/>
    <rect x="3" y="33" width="64" height="38" rx="2" fill="#0C0E1A"/>
    <rect x="3" y="33" width="64" height="38" rx="2" fill="#00E5FF" opacity="0.06"/>
    <!-- Dashboard/chart -->
    <rect x="8"  y="38" width="10" height="24" rx="1" fill="#00E5FF" opacity="0.6"/>
    <rect x="21" y="44" width="10" height="18" rx="1" fill="#00E5FF" opacity="0.5"/>
    <rect x="34" y="40" width="10" height="22" rx="1" fill="#A78BFA" opacity="0.6"/>
    <rect x="47" y="47" width="10" height="15" rx="1" fill="#00E5FF" opacity="0.4"/>
    <line x1="8" y1="62" x2="58" y2="62" stroke="#374151" stroke-width="1" opacity="0.5"/>
    <rect x="-5" y="74" width="80" height="8" rx="2" fill="#1E1B4B"/>
  </g>

  <!-- Laptop 4 (right table) -->
  <g transform="translate(445, 246)">
    <rect x="0" y="28" width="66" height="40" rx="3" fill="#1E1B4B"/>
    <rect x="3" y="31" width="60" height="34" rx="2" fill="#0C0E1A"/>
    <rect x="3" y="31" width="60" height="34" rx="2" fill="#FB7185" opacity="0.06"/>
    <line x1="8"  y1="38" x2="50" y2="38" stroke="#FB7185" stroke-width="1.5" opacity="0.6"/>
    <line x1="8"  y1="43" x2="38" y2="43" stroke="#FB7185" stroke-width="1.5" opacity="0.4"/>
    <line x1="8"  y1="48" x2="44" y2="48" stroke="#A78BFA" stroke-width="1.5" opacity="0.6"/>
    <line x1="8"  y1="53" x2="32" y2="53" stroke="#FB7185" stroke-width="1.5" opacity="0.5"/>
    <line x1="8"  y1="58" x2="48" y2="58" stroke="#22C55E" stroke-width="1.5" opacity="0.4"/>
    <rect x="-5" y="68" width="76" height="8" rx="2" fill="#1E1B4B"/>
  </g>

  <!-- Sticky notes on table edges -->
  <rect x="200" y="262" width="22" height="20" rx="2" fill="#FBBF24" opacity="0.9" transform="rotate(-5 211 272)"/>
  <rect x="228" y="258" width="22" height="20" rx="2" fill="#FB7185" opacity="0.85" transform="rotate(4 239 268)"/>
  <rect x="500" y="260" width="22" height="20" rx="2" fill="#22C55E" opacity="0.85" transform="rotate(-3 511 270)"/>
  <rect x="524" y="256" width="22" height="20" rx="2" fill="#A78BFA" opacity="0.85" transform="rotate(5 535 266)"/>

  <!-- === People behind tables === -->
  <!-- Person 1 (left table) — cyan hoodie -->
  <g transform="translate(68, 168)">
    <circle cx="30" cy="22" r="17" fill="#FDE68A"/>
    <ellipse cx="30" cy="60" rx="18" ry="22" fill="#00E5FF" opacity="0.85"/>
    <circle cx="24" cy="20" r="2.5" fill="#374151" opacity="0.8"/>
    <circle cx="36" cy="20" r="2.5" fill="#374151" opacity="0.8"/>
    <path d="M23 28 Q30 33 37 28" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Hair (short dark) -->
    <path d="M13 17 Q16 4 30 2 Q44 4 47 17" fill="#1C1917" opacity="0.9"/>
    <!-- Arms on table -->
    <path d="M12 52 Q5 65 8 80" stroke="#FDE68A" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M48 52 Q55 65 52 80" stroke="#FDE68A" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Person 2 (left table) — purple hoodie, focused -->
  <g transform="translate(164, 163)">
    <circle cx="28" cy="22" r="16" fill="#FBBF24"/>
    <ellipse cx="28" cy="59" rx="16" ry="21" fill="#7C3AED"/>
    <circle cx="22" cy="20" r="2.5" fill="#374151" opacity="0.8"/>
    <circle cx="34" cy="20" r="2.5" fill="#374151" opacity="0.8"/>
    <!-- Focused / squint expression -->
    <line x1="21" y1="28" x2="27" y2="28" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="29" y1="28" x2="35" y2="28" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Afro hair -->
    <circle cx="28" cy="14" r="16" fill="#1C1917" opacity="0.85"/>
    <path d="M12 52 Q4 64 7 78" stroke="#FBBF24" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M44 52 Q52 64 49 78" stroke="#FBBF24" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Person 3 (right table) — rose/pink, standing slightly -->
  <g transform="translate(354, 162)">
    <circle cx="28" cy="20" r="16" fill="#FDE68A"/>
    <ellipse cx="28" cy="58" rx="16" ry="20" fill="#FB7185"/>
    <circle cx="22" cy="18" r="2.5" fill="#374151" opacity="0.8"/>
    <circle cx="34" cy="18" r="2.5" fill="#374151" opacity="0.8"/>
    <path d="M21 26 Q28 31 35 26" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M14 8 Q18 -2 28 -4 Q38 -2 42 8" fill="#92400E" opacity="0.85"/>
    <!-- One arm raised (excited) -->
    <path d="M12 50 Q-5 35 -10 20" stroke="#FDE68A" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M44 50 Q52 62 50 75" stroke="#FDE68A" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Person 4 (right table) — green, side view -->
  <g transform="translate(452, 166)">
    <circle cx="28" cy="20" r="15" fill="#FCD34D"/>
    <ellipse cx="28" cy="57" rx="15" ry="20" fill="#22C55E"/>
    <circle cx="22" cy="18" r="2.5" fill="#374151" opacity="0.8"/>
    <circle cx="34" cy="18" r="2.5" fill="#374151" opacity="0.8"/>
    <path d="M21 26 Q28 31 35 26" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="28" cy="12" rx="16" ry="9" fill="#374151" opacity="0.85"/>
    <path d="M13 50 Q5 62 8 75" stroke="#FCD34D" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M43 50 Q51 62 48 75" stroke="#FCD34D" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Whiteboard (background) -->
  <rect x="220" y="40" width="160" height="100" rx="4" fill="#1E1B4B" stroke="#374151" stroke-width="1.5"/>
  <rect x="226" y="46" width="148" height="88" rx="2" fill="#0C0E1A"/>
  <!-- Code on whiteboard -->
  <text x="232" y="62" font-family="monospace" font-size="8" fill="#22C55E" opacity="0.8">function solve() {</text>
  <text x="240" y="73" font-family="monospace" font-size="8" fill="#A78BFA" opacity="0.7">  return kindness;</text>
  <text x="232" y="84" font-family="monospace" font-size="8" fill="#22C55E" opacity="0.8">}</text>
  <text x="232" y="98" font-family="monospace" font-size="8" fill="#00E5FF" opacity="0.6">// GrowUP 2026</text>
  <!-- Whiteboard marker tray -->
  <rect x="220" y="140" width="160" height="8" rx="2" fill="#374151" opacity="0.8"/>

  <!-- Energy burst lines (excitement) -->
  <g stroke="#FBBF24" stroke-width="1.5" opacity="0.4" stroke-linecap="round">
    <line x1="300" y1="30" x2="290" y2="18"/>
    <line x1="310" y1="28" x2="318" y2="16"/>
    <line x1="318" y1="34" x2="330" y2="26"/>
    <line x1="282" y1="34" x2="270" y2="26"/>
  </g>

  <!-- Floating emoji-style badges -->
  <circle cx="555" cy="80" r="18" fill="#FBBF24" opacity="0.15"/>
  <text x="555" y="86" font-size="18" text-anchor="middle" opacity="0.8">⚡</text>
  <circle cx="45" cy="100" r="15" fill="#00E5FF" opacity="0.1"/>
  <text x="45" y="106" font-size="14" text-anchor="middle" opacity="0.7">💡</text>

  <defs>
    <linearGradient id="hack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0C0E1A"/>
      <stop offset="50%"  stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#1a0f3a"/>
    </linearGradient>
  </defs>
</svg>
