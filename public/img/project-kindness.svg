<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- Soft warm background -->
  <rect width="600" height="400" fill="url(#kind-bg)"/>

  <!-- Large overlapping circles — connection & togetherness (NO PEOPLE) -->
  <!-- Circle cluster showing interconnection -->
  <circle cx="220" cy="200" r="100" fill="#FB7185" opacity="0.18"/>
  <circle cx="300" cy="160" r="90"  fill="#FBBF24" opacity="0.18"/>
  <circle cx="380" cy="200" r="100" fill="#A78BFA" opacity="0.18"/>
  <circle cx="300" cy="240" r="85"  fill="#34D399" opacity="0.18"/>
  <circle cx="260" cy="175" r="70"  fill="#60A5FA" opacity="0.14"/>
  <circle cx="340" cy="175" r="70"  fill="#FB923C" opacity="0.14"/>

  <!-- Circle outlines -->
  <circle cx="220" cy="200" r="100" stroke="#FB7185" stroke-width="2" opacity="0.4" fill="none"/>
  <circle cx="300" cy="160" r="90"  stroke="#FBBF24" stroke-width="2" opacity="0.4" fill="none"/>
  <circle cx="380" cy="200" r="100" stroke="#A78BFA" stroke-width="2" opacity="0.4" fill="none"/>
  <circle cx="300" cy="240" r="85"  stroke="#34D399" stroke-width="1.5" opacity="0.35" fill="none"/>

  <!-- Center glow — intersection of all circles -->
  <circle cx="300" cy="200" r="45" fill="url(#kind-center)" opacity="0.6"/>
  <circle cx="300" cy="200" r="25" fill="#fff" opacity="0.85"/>

  <!-- Hearts scattered -->
  <!-- Heart 1 (large, rose) -->
  <path d="M 300 112 C 300 106 293 102 289 106 C 285 102 278 106 278 112 C 278 118 289 126 289 126 C 289 126 300 118 300 112 Z"
    fill="#FB7185" opacity="0.9"/>
  <!-- Heart 2 (medium, amber) -->
  <path d="M 164 138 C 164 133 158 130 155 133 C 152 130 146 133 146 138 C 146 143 155 150 155 150 C 155 150 164 143 164 138 Z"
    fill="#FBBF24" opacity="0.85"/>
  <!-- Heart 3 (small, purple) -->
  <path d="M 454 138 C 454 134 449 131 446 134 C 443 131 438 134 438 138 C 438 142 446 148 446 148 C 446 148 454 142 454 138 Z"
    fill="#A78BFA" opacity="0.85"/>
  <!-- Heart 4 (small, green) -->
  <path d="M 180 290 C 180 286 175 284 173 286 C 171 284 166 286 166 290 C 166 294 173 299 173 299 C 173 299 180 294 180 290 Z"
    fill="#34D399" opacity="0.85"/>
  <!-- Heart 5 (small, blue) -->
  <path d="M 434 290 C 434 286 429 284 427 286 C 425 284 420 286 420 290 C 420 294 427 299 427 299 C 427 299 434 294 434 290 Z"
    fill="#60A5FA" opacity="0.85"/>

  <!-- Stars / sparkles -->
  <path d="M 80 180 L83 170 L86 180 L76 174 L90 174 Z" fill="#FBBF24" opacity="0.9"/>
  <path d="M 510 180 L513 170 L516 180 L506 174 L520 174 Z" fill="#FB7185" opacity="0.9"/>
  <path d="M 300 330 L303 321 L306 330 L297 325 L309 325 Z" fill="#A78BFA" opacity="0.9"/>
  <path d="M 120 300 L122 294 L124 300 L118 297 L126 297 Z" fill="#34D399" opacity="0.85"/>
  <path d="M 480 300 L482 294 L484 300 L478 297 L486 297 Z" fill="#60A5FA" opacity="0.85"/>
  <path d="M 300 52 L302 46 L304 52 L298 49 L306 49 Z" fill="#FBBF24" opacity="0.85"/>
  <path d="M 60 80 L62 75 L64 80 L58 77 L66 77 Z" fill="#FB7185" opacity="0.7"/>
  <path d="M 540 80 L542 75 L544 80 L538 77 L546 77 Z" fill="#A78BFA" opacity="0.7"/>

  <!-- Abstract art supplies: paint dots scattered -->
  <circle cx="100" cy="90"  r="8"  fill="#FB7185" opacity="0.7"/>
  <circle cx="116" cy="82"  r="5"  fill="#FBBF24" opacity="0.7"/>
  <circle cx="84"  cy="78"  r="4"  fill="#60A5FA" opacity="0.7"/>
  <circle cx="500" cy="90"  r="8"  fill="#34D399" opacity="0.7"/>
  <circle cx="516" cy="82"  r="5"  fill="#A78BFA" opacity="0.7"/>
  <circle cx="484" cy="78"  r="4"  fill="#FB923C" opacity="0.7"/>
  <!-- Crayon shapes (colorful diagonal rectangles) -->
  <rect x="48"  y="320" width="8" height="28" rx="4" fill="#FB7185" transform="rotate(-20 52 334)"/>
  <rect x="62"  y="318" width="8" height="28" rx="4" fill="#FBBF24" transform="rotate(5 66 332)"/>
  <rect x="76"  y="322" width="8" height="28" rx="4" fill="#34D399" transform="rotate(18 80 336)"/>
  <rect x="514" y="320" width="8" height="28" rx="4" fill="#60A5FA" transform="rotate(-15 518 334)"/>
  <rect x="528" y="316" width="8" height="28" rx="4" fill="#A78BFA" transform="rotate(8 532 330)"/>

  <!-- Connection arcs between hearts (warm lines) -->
  <path d="M 289 126 Q 260 155 220 175" stroke="#FB7185" stroke-width="1.5" opacity="0.3" fill="none" stroke-dasharray="4 4"/>
  <path d="M 289 126 Q 300 144 300 155" stroke="#FBBF24" stroke-width="1.5" opacity="0.3" fill="none" stroke-dasharray="4 4"/>
  <path d="M 289 126 Q 320 144 380 175" stroke="#A78BFA" stroke-width="1.5" opacity="0.3" fill="none" stroke-dasharray="4 4"/>

  <!-- Label -->
  <rect x="22" y="18" width="120" height="28" rx="14" fill="#FB7185" opacity="0.9"/>
  <text x="82" y="36" font-family="monospace" font-size="10" letter-spacing="0.08em"
    text-anchor="middle" fill="white" font-weight="600">KINDNESS LAB</text>

  <defs>
    <radialGradient id="kind-bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </radialGradient>
    <radialGradient id="kind-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </radialGradient>
  </defs>
</svg>
