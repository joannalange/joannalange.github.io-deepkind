<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" aria-hidden="true">
  <!-- EKG / heart-pulse line -->
  <polyline
    points="5,60 22,60 30,60 36,30 42,90 50,45 56,75 62,60 78,60 84,60 90,40 96,80 102,60 118,60"
    stroke="currentColor" stroke-width="1.5" opacity="0.55" fill="none"
    stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Heartbeat peak glow dot -->
  <circle cx="36" cy="30" r="3" fill="currentColor" opacity="0.6"/>
  <circle cx="36" cy="30" r="7" stroke="currentColor" stroke-width="0.75" opacity="0.2" fill="none"/>
  <!-- Subtle horizontal baseline -->
  <line x1="5" y1="60" x2="118" y2="60" stroke="currentColor" stroke-width="0.5" opacity="0.12"/>
  <!-- Small heart shape at top-right -->
  <path d="M 92 20 C 92 17 88 14 85 17 C 82 14 78 17 78 20 C 78 24 85 30 85 30 C 85 30 92 24 92 20 Z"
    stroke="currentColor" stroke-width="1" opacity="0.35" fill="none"/>
</svg>
