<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 36" fill="none" aria-label="DeepKind">
  <!-- Mark: two overlapping shapes — a precise diamond (tech) and a soft organic drop (human) -->
  <g>
    <!-- Organic drop / warmth shape -->
    <ellipse cx="16" cy="18" rx="7" ry="9" fill="url(#logo-grad-warm)" opacity="0.9"/>
    <!-- Precise diamond / tech shape -->
    <path d="M16 7 L25 18 L16 29 L7 18 Z" fill="url(#logo-grad-cool)" opacity="0.85"/>
    <!-- Center intersection dot -->
    <circle cx="16" cy="18" r="2.5" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Wordmark -->
  <text
    x="34"
    y="24"
    font-family="Inter Tight, sans-serif"
    font-weight="800"
    font-size="19"
    letter-spacing="-0.04em"
    fill="white"
  >DeepKind</text>

  <defs>
    <linearGradient id="logo-grad-warm" x1="9" y1="9" x2="23" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="logo-grad-cool" x1="7" y1="7" x2="25" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
  </defs>
</svg>
