<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" fill="none" aria-hidden="true">
  <!-- A whimsical row of abstract floating shapes -->
  <!-- Circle cluster left -->
  <circle cx="40"  cy="60" r="28" fill="#00E5FF" opacity="0.2"/>
  <circle cx="60"  cy="45" r="18" fill="#00B8CC" opacity="0.3"/>
  <circle cx="28"  cy="75" r="12" fill="#7C3AED" opacity="0.25"/>

  <!-- Star / asterisk -->
  <g transform="translate(140,60)" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="0" y1="-22" x2="0"   y2="22"/>
    <line x1="-22" y1="0" x2="22"  y2="0"/>
    <line x1="-16" y1="-16" x2="16" y2="16"/>
    <line x1="16"  y1="-16" x2="-16" y2="16"/>
  </g>
  <circle cx="140" cy="60" r="8" fill="#FBBF24" opacity="0.5"/>

  <!-- Rounded rectangle (pill) -->
  <rect x="190" y="40" width="70" height="40" rx="20"
    fill="#FB7185" opacity="0.2" stroke="#FB7185" stroke-width="2" opacity="0.4"/>

  <!-- Triangle -->
  <polygon points="320,28 350,88 290,88"
    fill="none" stroke="#7C3AED" stroke-width="2.5" opacity="0.45"/>
  <polygon points="320,38 344,82 296,82"
    fill="#7C3AED" opacity="0.1"/>

  <!-- Donut ring -->
  <circle cx="430" cy="60" r="28" stroke="#00B8CC" stroke-width="5" fill="none" opacity="0.4"/>
  <circle cx="430" cy="60" r="14" fill="#00E5FF" opacity="0.2"/>

  <!-- Plus mark (large) -->
  <g transform="translate(530,60)" stroke="#FB7185" stroke-width="4" stroke-linecap="round" opacity="0.45">
    <line x1="-20" y1="0" x2="20" y2="0"/>
    <line x1="0" y1="-20" x2="0" y2="20"/>
  </g>

  <!-- Diamond -->
  <polygon points="630,32 658,60 630,88 602,60"
    fill="none" stroke="#FBBF24" stroke-width="2.5" opacity="0.45"/>
  <polygon points="630,40 652,60 630,80 608,60"
    fill="#FBBF24" opacity="0.12"/>

  <!-- Squiggly line accent -->
  <path d="M 690 55 Q 705 40 720 55 Q 735 70 750 55 Q 765 40 780 55"
    stroke="#FB7185" stroke-width="2.5" fill="none" opacity="0.4" stroke-linecap="round"/>
</svg>
