<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" fill="none" aria-hidden="true">
  <!-- Organic blob — warmth/human element -->
  <ellipse cx="360" cy="370" rx="240" ry="270"
    fill="url(#blob-grad)" opacity="0.18"
    transform="rotate(-15 360 370)"/>
  <ellipse cx="380" cy="340" rx="200" ry="230"
    fill="url(#blob-grad-2)" opacity="0.12"
    transform="rotate(10 380 340)"/>

  <!-- Orbital rings — tech/precision element -->
  <!-- Ring 1 -->
  <ellipse cx="360" cy="360" rx="280" ry="140"
    stroke="url(#ring-grad)" stroke-width="1" opacity="0.35"
    transform="rotate(-30 360 360)"/>
  <!-- Ring 2 -->
  <ellipse cx="360" cy="360" rx="230" ry="115"
    stroke="url(#ring-grad)" stroke-width="0.75" opacity="0.25"
    transform="rotate(-30 360 360)"/>
  <!-- Ring 3 -->
  <ellipse cx="360" cy="360" rx="180" ry="90"
    stroke="#00E5FF" stroke-width="0.75" opacity="0.2"
    transform="rotate(-30 360 360)"/>
  <!-- Ring 4 — close -->
  <ellipse cx="360" cy="360" rx="120" ry="60"
    stroke="#00E5FF" stroke-width="1" opacity="0.3"
    stroke-dasharray="4 8"
    transform="rotate(-30 360 360)"/>

  <!-- Orbital dots on ring 1 -->
  <circle cx="98"  cy="268" r="4" fill="#00E5FF" opacity="0.8"/>
  <circle cx="622" cy="452" r="3" fill="#00E5FF" opacity="0.6"/>
  <circle cx="200" cy="174" r="2.5" fill="#7C3AED" opacity="0.7"/>
  <circle cx="520" cy="546" r="2" fill="#7C3AED" opacity="0.5"/>

  <!-- Connector lines from dots toward center -->
  <line x1="98"  y1="268" x2="330" y2="350" stroke="#00E5FF" stroke-width="0.5" opacity="0.15"/>
  <line x1="622" y1="452" x2="390" y2="370" stroke="#00E5FF" stroke-width="0.5" opacity="0.1"/>

  <!-- Grid fragment — top right quadrant -->
  <g opacity="0.06" stroke="#00E5FF" stroke-width="0.75">
    <line x1="480" y1="80"  x2="480" y2="320"/>
    <line x1="528" y1="80"  x2="528" y2="280"/>
    <line x1="576" y1="80"  x2="576" y2="240"/>
    <line x1="624" y1="80"  x2="624" y2="200"/>
    <line x1="430" y1="100" x2="680" y2="100"/>
    <line x1="430" y1="148" x2="650" y2="148"/>
    <line x1="430" y1="196" x2="620" y2="196"/>
  </g>

  <!-- Central glow / energy core -->
  <circle cx="360" cy="360" r="60" fill="url(#core-grad)" opacity="0.25"/>
  <circle cx="360" cy="360" r="30" fill="url(#core-grad)" opacity="0.35"/>
  <circle cx="360" cy="360" r="10" fill="#00E5FF" opacity="0.6"/>

  <!-- Scattered small dots (stars/data) -->
  <circle cx="150" cy="120" r="1.5" fill="#00E5FF" opacity="0.5"/>
  <circle cx="580" cy="150" r="1"   fill="#FB7185" opacity="0.6"/>
  <circle cx="640" cy="300" r="1.5" fill="#00E5FF" opacity="0.4"/>
  <circle cx="120" cy="480" r="1"   fill="#7C3AED" opacity="0.5"/>
  <circle cx="600" cy="560" r="1.5" fill="#FB7185" opacity="0.45"/>
  <circle cx="240" cy="580" r="1"   fill="#00E5FF" opacity="0.4"/>
  <circle cx="440" cy="100" r="1"   fill="#FBBF24" opacity="0.5"/>
  <circle cx="90"  cy="350" r="1.5" fill="#FBBF24" opacity="0.35"/>

  <!-- Rose accent arc -->
  <path d="M 200 520 Q 280 460 360 500 Q 440 540 520 480"
    stroke="#FB7185" stroke-width="1.5" opacity="0.2" fill="none"
    stroke-linecap="round"/>

  <defs>
    <radialGradient id="blob-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#3730A3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob-grad-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#3730A3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="core-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
