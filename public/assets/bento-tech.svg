<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" aria-hidden="true">
  <!-- Circuit / grid pattern -->
  <rect x="10" y="10" width="100" height="100" stroke="currentColor" stroke-width="1" opacity="0.4" fill="none"/>
  <line x1="10"  y1="40" x2="110" y2="40" stroke="currentColor" stroke-width="0.75" opacity="0.3"/>
  <line x1="10"  y1="70" x2="110" y2="70" stroke="currentColor" stroke-width="0.75" opacity="0.3"/>
  <line x1="40"  y1="10" x2="40"  y2="110" stroke="currentColor" stroke-width="0.75" opacity="0.3"/>
  <line x1="70"  y1="10" x2="70"  y2="110" stroke="currentColor" stroke-width="0.75" opacity="0.3"/>
  <!-- Circuit nodes -->
  <circle cx="40" cy="40" r="3" fill="currentColor" opacity="0.6"/>
  <circle cx="70" cy="70" r="3" fill="currentColor" opacity="0.6"/>
  <circle cx="40" cy="70" r="2" fill="currentColor" opacity="0.4"/>
  <circle cx="70" cy="40" r="2" fill="currentColor" opacity="0.4"/>
  <!-- Corner brackets -->
  <path d="M10 25 L10 10 L25 10" stroke="currentColor" stroke-width="1.5" opacity="0.7" fill="none"/>
  <path d="M95 10 L110 10 L110 25" stroke="currentColor" stroke-width="1.5" opacity="0.7" fill="none"/>
  <path d="M110 95 L110 110 L95 110" stroke="currentColor" stroke-width="1.5" opacity="0.7" fill="none"/>
  <path d="M25 110 L10 110 L10 95" stroke="currentColor" stroke-width="1.5" opacity="0.7" fill="none"/>
</svg>
