<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" fill="none" aria-hidden="true">

  <!-- 1. Large indigo ring — the tech/structure element -->
  <circle cx="260" cy="220" r="160" stroke="#3730A3" stroke-width="48" fill="none" opacity="0.82"/>

  <!-- 2. Solid rose circle — humanity/warmth, overlapping ring -->
  <circle cx="150" cy="310" r="110" fill="#FB7185" opacity="0.85"/>

  <!-- 3. Solid amber accent — energy, top-right -->
  <circle cx="370" cy="110" r="70"  fill="#FBBF24" opacity="0.88"/>

  <!-- 4. Cyan small circle — contrast accent -->
  <circle cx="380" cy="340" r="52"  fill="#00E5FF" opacity="0.82"/>

  <!-- 5. Purple arc — bottom-left framing -->
  <path d="M 30 480 A 140 140 0 0 1 170 340"
    stroke="#7C3AED" stroke-width="44" fill="none" opacity="0.80" stroke-linecap="round"/>

</svg>
